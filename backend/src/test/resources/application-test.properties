spring.datasource.url=jdbc:postgresql://localhost:5432/inkscribe_test
spring.datasource.username=postgres
spring.datasource.password=${TEST_DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=create-drop
app.ratelimit.auth-max=100000
app.ratelimit.public-max=100000
app.jwt.secret=ci-only-secret-at-least-32-characters-long
app.enc.key=ci-only-encryption-key-32-characters-min